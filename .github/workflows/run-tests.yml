name: run-tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: bcmath, curl, intl, mailparse, mbstring, opcache, pcntl, pdo_sqlite, pdo_pgsql, pgsql, readline, sockets, xml, zip

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare report directory
        run: mkdir -p build

      - name: Execute tests
        run: vendor/bin/pest --ci --log-junit build/report.junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-php${{ matrix.php }}
          path: build/report.junit.xml
          if-no-files-found: error
          retention-days: 7

  process-test-data:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Download reports artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts

      - name: Publish test results
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: downloaded_artifacts/**/*.junit.xml
          include_passed: true
          follow_symlink: true
          require_tests: true
          detailed_summary: true
