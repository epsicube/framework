name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        php: [ '8.4', '8.5' ]
        laravel: [ '13.*', '12.*' ]
        stability: [ prefer-lowest, prefer-stable ]
        include:
          - laravel: '13.*'
            laravel_label: '13'
          - laravel: '12.*'
            laravel_label: '12'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, intl, mailparse, mbstring, opcache, pcntl, pdo_sqlite, pdo_pgsql, pgsql, readline, sockets, xml, zip
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Get Composer cache directory
        id: composer-cache
        shell: bash # Force bash to ensure windows compatibility
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel_label }}-${{ matrix.stability }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel_label }}-${{ matrix.stability }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Prepare report directory
        run: mkdir -p build

      - name: Execute tests
        id: tests
        run: |
          set +e
          php vendor/bin/pest --configuration phpunit.xml.dist --ci --log-junit build/report.junit.xml
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel_label }}-${{ matrix.stability }}
          path: build/report.junit.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish test results (Linux)
        if: always() && matrix.os == 'ubuntu-latest'
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        with:
          files: build/report.junit.xml
          check_name: Test Results (PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel_label }} / ${{ matrix.stability }} / ${{ matrix.os }})

      - name: Publish test results (Windows)
        if: always() && matrix.os == 'windows-latest'
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        with:
          files: build/report.junit.xml
          check_name: Test Results (PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel_label }} / ${{ matrix.stability }} / ${{ matrix.os }})

      - name: Fail job on test failure
        if: steps.tests.outputs.exit_code != '0'
        run: exit "${{ steps.tests.outputs.exit_code }}"
